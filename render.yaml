services:
  - type: web
    name: sasbo-online-backend
    runtime: java
    buildCommand: ./gradlew build -x test
    startCommand: java -jar /opt/render/project/src/build/libs/sasbo-online-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SSL_MODE
        value: require
      - key: SERVER_PORT
        value: "10000"
