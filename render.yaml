services:
  - type: web
    name: sasbo-online-backend
    runtime: java
    buildCommand: ./gradlew build -x test
    startCommand: java -jar $(ls build/libs/*.jar | grep -v plain)
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SSL_MODE
        value: require
      - key: SERVER_PORT
        value: "10000"
