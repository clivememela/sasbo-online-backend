spring:
  application:
    name: sasbo-online-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sasbo_membership}
    username: ${DB_USERNAME:${USER}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    za.co.titandynamix: INFO
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.springframework.web.filter.CommonsRequestLoggingFilter: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN