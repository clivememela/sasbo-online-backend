spring:
  application:
    name: sasbo-online-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 10
    clean-disabled: true
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    check-template-location: false
    enabled: false
  mvc:
    static-path-pattern: /static/**
    throw-exception-if-no-handler-found: true
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: DEBUG
    za.co.titandynamix: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.coyote.http11.Http11Processor: ERROR

front:
  end:
    url: ${FRONTEND_URL:}

mail:
  from: ${MAIL_FROM:noreply@sasbo.co.za}

# The ACB bureau file's four collection identifiers: SASBO's user code, user branch, the account the
# debits are credited to, and its bank identifiers. From the environment only -- never committed.
# Unset, a file refuses to render (FILE_SETTINGS_MISSING) and names what is missing; nothing else
# in the application needs them. The file's constants default in AcbFileProperties.
acb:
  file:
    user-code: ${ACB_FILE_USER_CODE:}
    user-branch: ${ACB_FILE_USER_BRANCH:}
    nominated-account: ${ACB_FILE_NOMINATED_ACCOUNT:}
    bank-identifiers: ${ACB_FILE_BANK_IDENTIFIERS:}

# THE PRODUCTION MARKER. Set SASBO_ENVIRONMENT=production on the production service, once, the day it
# is created -- and nowhere else: not on dev.sasbo.online, not in CI, not in the E2E stack. Where it says
# production, no synthetic member and no ACB history is ever seeded, and no bureau file is made from a
# seeded member. Blank means a demo. Anything else stops the start-up and says what it accepts.
sasbo:
  environment: ${SASBO_ENVIRONMENT:}
