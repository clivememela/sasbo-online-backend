spring:
  application:
    name: sasbo-online-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        sslmode: ${SSL_MODE}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 10
    # locations: classpath:db/migration do not use in production
    clean-disabled: false
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: DEBUG
    za.co.titandynamix: DEBUG
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.springframework.web.filter.CommonsRequestLoggingFilter: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.coyote.http11.Http11Processor: ERROR
    
front:
  end:
    url: ${FRONTEND_URL:}
  