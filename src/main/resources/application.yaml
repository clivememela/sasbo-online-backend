spring:
  application:
    name: sasbo-online-backend
  # Sign-in (October build): staff sign in through /api/auth with a bearer token; nothing signs in with an in-memory user.
  # Left on, this auto-configuration made one and wrote its generated password to the log at every start -- and no
  # password is ever logged (contracts/signin.md). SignInConfigGuardTest holds it off.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 10
    clean-disabled: true
    validate-on-migrate: false
  jpa:
    hibernate:
      # 🔴 `validate`, NOT `update` -- Flyway owns the schema and Hibernate only checks it.
      #
      # This file used to say `update`, which meant BOTH managed the schema: Flyway built it from the
      # migrations, then Hibernate altered it to match the entity classes, adding whatever the migrations
      # had not. The database then holds columns no migration created, it differs from any environment
      # built from migrations alone, and `validate-on-migrate: false` below means nothing ever says so.
      #
      # 🔑 The decision was already made and written down -- for the tests only.
      # `src/test/resources/application-integration.yaml` has said `ddl-auto: validate` all along, with
      # the comment "The schema under test is the one production runs. ddl-auto would test Hibernate's
      # opinion of the schema instead, which is the drift this whole arc exists to close." That premise
      # was false in production until this change: production ran Hibernate's opinion.
      #
      # So this costs nothing to prove -- the integration lane has been running `validate` against a real
      # Postgres built by Flyway on every green run. It makes a disagreement between entities and
      # migrations a LOUD startup failure instead of a silent schema edit.
      ddl-auto: validate
    # 🔴 Off. On 2026-09-28 this was the whole of a production slowdown: every query's SQL went to the
    # host's log pipeline, and on a 0.5-CPU instance that I/O compounded -- four identical calls to
    # /api/banks took 3.1s, 6.8s, 7.1s, then 11.8s. With it off the same call is ~1.3s, flat.
    show-sql: false
    # `generate-ddl` is Hibernate's other route to writing DDL, and it is removed for the same reason
    # `ddl-auto` is no longer `update`: exactly one thing owns this schema, and it is Flyway.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    check-template-location: false
    enabled: false
  mvc:
    static-path-pattern: /static/**
    throw-exception-if-no-handler-found: true
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Bounded (October build): month end e-mails the regions' packs on the request that asks, and an SMTP server
          # that never answers would otherwise hold that request -- and its thread -- for good. Milliseconds.
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 30000

# 🔴 THE MAIL HEALTH INDICATOR IS OFF, AND WITHOUT THIS THE APPLICATION IS UNDEPLOYABLE.
#
# `/actuator/health` is not "is this app alive" -- it is the AGGREGATE of every auto-configured
# HealthIndicator, and any one of them DOWN makes the endpoint return HTTP 503.
#
# `spring-boot-starter-mail` is on the classpath, so `MailHealthIndicator` auto-configures and
# authenticates to MAIL_HOST on every check. In any environment without mail credentials -- which is
# every environment we have -- it throws `AuthenticationFailedException: failed to connect, no password
# specified?`, health is DOWN, and the endpoint answers 503.
#
# On 2026-09-28 that cost FOUR consecutive fifteen-minute deploys on Render. Each one polled
# /actuator/health, got 503 every time, logged "==> Timed Out" and killed a perfectly healthy
# application -- while Flyway had the schema at V52, Hikari had its pool, and startup took 67 seconds.
# It looks exactly like a broken app and is nothing of the kind.
#
# 🔑 Readiness means "can this instance serve requests". An API that cannot send email still serves
# every request, so SMTP being unconfigured must never take it out of rotation. Turn this back on only
# together with real mail credentials, and even then prefer a readiness GROUP over the full aggregate.
management:
  health:
    mail:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  # The caller's address, not the host's proxy's: Tomcat's RemoteIpValve reads X-Forwarded-For from the right, past
  # the internal proxies, so a client cannot choose it by sending the header. The login throttle keys on it, and a
  # session records it (the sign-in review, 7 Oct). `native`, not `framework`: the valve, not a filter that trusts all.
  forward-headers-strategy: native
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

logging:
  level:
    # INFO, not DEBUG. As DEBUG this printed every Hibernate SQL AST, every alias registration and every
    # entity -- a 2026-09-28 deploy spent fifteen minutes seeding with most of it formatting log lines
    # nobody reads, and `EntityPrinter` wrote real subscription amounts into the host's logs, where
    # anyone with dashboard access can read them. The application's own package stays at DEBUG below,
    # so its detail is kept and the framework firehose is not.
    root: INFO
    za.co.titandynamix: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.coyote.http11.Http11Processor: ERROR

front:
  end:
    url: ${FRONTEND_URL:}

mail:
  from: ${MAIL_FROM:noreply@sasbo.co.za}

# Month end's files that leave SASBO (October build). Law Call's list goes straight onto the provider's SFTP server
# (Stephne, MEN-35: "Azoza List goes directly onto their STFP"). OFF UNLESS ALL FOUR OF host, username, private-key-path
# AND known-hosts ARE SET on a host, by the owner -- until then the screen says "not configured" and the list is
# downloaded. The key is named by its PATH (a secret file the host mounts), never written here; known-hosts is the
# server's public host key line, so the server is checked, never trusted blind. No credential is ever committed.
month-end:
  sftp:
    host: ${MONTH_END_SFTP_HOST:}
    port: ${MONTH_END_SFTP_PORT:22}
    username: ${MONTH_END_SFTP_USERNAME:}
    private-key-path: ${MONTH_END_SFTP_PRIVATE_KEY_PATH:}
    known-hosts: ${MONTH_END_SFTP_KNOWN_HOSTS:}
    directory: ${MONTH_END_SFTP_DIRECTORY:}

# The ACB bureau file's four collection identifiers: SASBO's user code, user branch, the account the
# debits are credited to, and its bank identifiers. From the environment only -- never committed.
# Unset, a file refuses to render (FILE_SETTINGS_MISSING) and names what is missing; nothing else
# in the application needs them. The file's constants default in AcbFileProperties.
acb:
  file:
    user-code: ${ACB_FILE_USER_CODE:}
    user-branch: ${ACB_FILE_USER_BRANCH:}
    nominated-account: ${ACB_FILE_NOMINATED_ACCOUNT:}
    bank-identifiers: ${ACB_FILE_BANK_IDENTIFIERS:}
  letters:
    # The debit order letters come from, and members reply to, the address Stephne named (DOD-34). The mail
    # server must be allowed to send as it. Sending itself stays off until SASBO agree the letters
    # (acb.letters.send-enabled, false by default).
    from: ${ACB_LETTERS_FROM:members@sasbo.org.za}

# THE PRODUCTION MARKER. Set SASBO_ENVIRONMENT=production on the production service, once, the day it
# is created -- and nowhere else: not on dev.sasbo.online, not in CI, not in the E2E stack. Where it says
# production, no synthetic member and no ACB history is ever seeded, and no bureau file is made from a
# seeded member. Blank means a demo. Anything else stops the start-up and says what it accepts.
sasbo:
  environment: ${SASBO_ENVIRONMENT:}
  # THE SWITCH (month end, MD45, MD50, MD62): whether SASBO's own branch list -- 5,507 real workplaces with their
  # staff complement -- and the invented members who stand at them are seeded AND served here. `none`, `names` or
  # `all`; unset is `none`, and any other word stops the start. Off unless it is set: set it on a hosted stack only
  # on SASBO's word (MM79). The suite's compose sets it for the local run.
  workplaces: ${SASBO_WORKPLACES:}
  # SIGN-IN (October build, contracts/signin.md). Each binding is written out, so the variable's name is the one
  # documented (relaxed binding would otherwise want SASBO_SIGNIN_DEMOUSERS).
  signin:
    # `open` (the default) keeps every route answering as it did, and gates only what names a permission; `required`
    # needs a session for every /api route but signing in, the mode and the health check. Anything else stops the
    # start. The owner switches it before go-live (6 Oct).
    mode: ${SASBO_SIGNIN:open}
    # One demonstration user per provisional position -- only where this is true AND SASBO_SIGNIN_DEMO_PASSWORD is
    # set, and never under the production marker. No hosted stack sets either: the link is public. The suite's
    # compose and a local run set both. The password has no default anywhere.
    demo-users: ${SASBO_SIGNIN_DEMO_USERS:false}
    demo-password: ${SASBO_SIGNIN_DEMO_PASSWORD:}
    # The first System Administrator, created at a start where there are no users at all and both are set -- and,
    # break-glass, at any start where no active System Administrator who sees all of SASBO is left (the named user is
    # created, or made one again). Set on a host by the owner; the password must be changed at the next sign-in.
    bootstrap-admin:
      username: ${SASBO_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${SASBO_BOOTSTRAP_ADMIN_PASSWORD:}
    # POST /api/auth/login, a minute at a time, before any password is checked: 429 SIGN_IN_THROTTLED past either.
    throttle:
      per-address-per-minute: ${SASBO_SIGNIN_THROTTLE_PER_ADDRESS:30}
      per-minute: ${SASBO_SIGNIN_THROTTLE_PER_MINUTE:120}
  letters:
    # THE LETTERS' TYPEFACE, one setting (the owner's decision, 6 Oct 2026): TeX Gyre Adventor, the free look of
    # SASBO's Avant Garde, until a licensed Avant Garde is in hand. A folder of regular.ttf (bold.ttf, italic.ttf
    # optional), classpath: or file: -- config/fonts/README.md. A font that cannot be used stops the start-up.
    font: ${SASBO_LETTERS_FONT:classpath:fonts/letters/adventor/}
