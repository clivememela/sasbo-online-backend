spring:
  datasource:
    url: jdbc:h2:mem:sasbo-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

server:
  port: 0

# ACB's jobs -- a run's preparation -- run on the caller's thread under every test lane, so a test
# sees the job's result without waiting for it, and no job outlives the test that started it.
acb:
  jobs:
    synchronous: true

# Month end's statistics pack (04.10) runs on the caller's thread under every test lane, for the same reason -- on a
# launcher of its own, never ACB's (MR-ROB-33).
month-end:
  packs:
    synchronous: true

# The data migration's jobs -- a check, a move, an undo -- run on the caller's thread under every test lane too, on a
# launcher of their own.
migration:
  jobs:
    synchronous: true
