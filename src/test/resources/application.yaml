spring:
  datasource:
    url: jdbc:h2:mem:sasbo-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

server:
  port: 0

# ACB's jobs -- a run's preparation -- run on the caller's thread under every test lane, so a test
# sees the job's result without waiting for it, and no job outlives the test that started it.
acb:
  jobs:
    synchronous: true

# Month end's statistics pack (04.10) runs on the caller's thread under every test lane, for the same reason -- on a
# launcher of its own, never ACB's (MR-ROB-33).
month-end:
  packs:
    synchronous: true

# The login throttle (SignInThrottle) counts in this JVM's memory for the life of a cached context, and some contexts
# run on a clock that never moves: a test lane signing in more than the real limit would be refused for reasons no test
# asked about. Out of the way here; SignInThrottleTest builds its own with the real limits' shape.
sasbo:
  signin:
    throttle:
      per-address-per-minute: 1000000
      per-minute: 1000000
# Payroll's retention job off in every test lane: no job runs beside a test. Its own tests call it directly.
payroll:
  retention:
    enabled: false
