# Hostile order.
#
# Order dependence is the most common root of a flaky suite, and declaration
# order is exactly what hides it: a test that only passes because a sibling ran
# first passes every single time, until the day someone adds a test above it.
# Randomising order does not create that bug -- it makes an existing one visible.
#
# This file is MODULE-GLOBAL. It applies to every test here, including the ones
# that predate this arc. If one of them turns out to be order-dependent, this is
# the change that shows it, and the fix is to fix the test. The setting is never
# softened to keep a build green.
#
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$Random

# Parallelism.
#
# Landed after random order, separately and on purpose: both change how every
# test in this module runs, and landing them together would have made an order
# bug and a thread-safety bug indistinguishable.
#
# CLASSES concurrent, METHODS serial within a class. Methods in one class share
# fixtures and a Spring context; running them concurrently races over shared
# state more than it saves in wall-clock. Classes are the unit that is actually
# independent.
#
# The `dynamic` strategy sizes the pool from available processors, so the same
# file behaves sensibly on a developer machine and on a small CI runner.
#
# What this exposes, and why it is safe here: the fast lane's datasource is
# jdbc:h2:mem:sasbo-test;DB_CLOSE_DELAY=-1 -- a NAMED in-memory database that
# outlives its connections, so every parallel class shares one database. Every
# DB-touching fast test must therefore be transactional or uniquely keyed. That
# is the precondition for this setting, not a tidy-up after it.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic
