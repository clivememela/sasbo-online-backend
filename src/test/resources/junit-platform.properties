# Hostile order.
#
# Order dependence is the most common root of a flaky suite, and declaration
# order is exactly what hides it: a test that only passes because a sibling ran
# first passes every single time, until the day someone adds a test above it.
# Randomising order does not create that bug -- it makes an existing one visible.
#
# This file is MODULE-GLOBAL. It applies to every test here, including the ones
# that predate this arc. If one of them turns out to be order-dependent, this is
# the change that shows it, and the fix is to fix the test. The setting is never
# softened to keep a build green.
#
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$Random

# Parallelism.
#
# Landed after random order, separately and on purpose: both change how every
# test in this module runs, and landing them together would have made an order
# bug and a thread-safety bug indistinguishable.
#
# CLASSES concurrent, METHODS serial within a class. Methods in one class share
# fixtures and a Spring context; running them concurrently races over shared
# state more than it saves in wall-clock. Classes are the unit that is actually
# independent.
#
# The `dynamic` strategy sizes the pool from available processors, so the same
# file behaves sensibly on a developer machine and on a small CI runner.
#
# What this exposes, and why it is safe here: the fast lane's datasource is
# jdbc:h2:mem:sasbo-test;DB_CLOSE_DELAY=-1 -- a NAMED in-memory database that
# outlives its connections, so every parallel class shares one database. Every
# DB-touching fast test must therefore be transactional or uniquely keyed. That
# is the precondition for this setting, not a tidy-up after it.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic

# The factor, stated rather than defaulted.
#
# 🔴 AND STATING IT DOES NOT MAKE THIS SUITE'S PARALLELISM HOST-INDEPENDENT, which
# a first draft of this comment implied and which is worth correcting rather than
# quietly leaving. `dynamic` computes availableProcessors() * factor. Pinning the
# MULTIPLIER at its own default leaves the MULTIPLICAND host-derived, so the pool
# still tracks whatever box the suite lands on -- the very thing the finding
# named. The only setting that would close it is `strategy = fixed` with
# `fixed.parallelism`.
#
# ⏳ SO THE HOST-SCALING IS RECORDED AS THE POLICY, not as an oversight. It is the
# right default for a suite that runs on a twelve-core developer box and on a
# two-core CI runner: `fixed` would either oversubscribe the small one or waste
# the large one, and picking N is the same quiet-host timing experiment the heap
# ceiling is waiting on. Writing the factor out makes the formula visible at the
# place someone would come looking to change it.
#
# ⚠️ A different factor is a deliberate experiment, not a tweak: raising it
# oversubscribes a box measured between 1.0 and 2.7 GB free, and dropping to one
# thread would hide the thread-safety problems the concurrent class mode above
# exists to expose.
junit.jupiter.execution.parallel.config.dynamic.factor = 1

# The pool may not grow past its parallelism.
#
# 🔴 FOUND 2026-09-22, on the first P1 runs on the owner's repositories: RecruiterControllerTest failed with
# "Cannot start new transaction without ending existing transaction", thrown by Spring's
# TransactionalTestExecutionListener before the test ran, in a pull request that changed only CI configuration
# (run 35720901980), on JUnit worker 3 of a pool whose parallelism is 2. Read from the bytecode of the versions
# in use: Spring 6.2 keeps the test transaction in an INHERITABLE thread local, JUnit 1.11's workers inherit
# thread locals from the thread that creates them, and the dynamic strategy's default maximum is 256 +
# parallelism. So when a test blocks in a way the JDK reports to the pool (ForkJoinPool.managedBlock:
# CompletableFuture.join, condition waits, queue hand-offs) and no worker is idle, the pool creates a worker FROM
# THE BLOCKED THREAD. That worker carries the blocked test's transaction into the next class it runs.
#
# A maximum equal to the parallelism removes that step: no worker is ever created from inside a test. While a
# test blocks, the pool runs one class fewer. `saturate` stays at its default, true, so a blocked worker waits
# instead of throwing. guards/ParallelPoolTest holds both, and its Javadoc has the whole mechanism.
junit.jupiter.execution.parallel.config.dynamic.max-pool-size-factor = 1
