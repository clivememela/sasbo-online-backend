# The integration lane.
#
# There is no datasource here on purpose. @ServiceConnection on the container in
# AbstractPostgresIT supplies the URL, user and password at a precedence nothing
# in .env.local can reach -- and a guard asserts that, rather than trusting it.
# A JDBC URL written in this file would be a URL someone could point at the one
# database on this machine that cannot be rebuilt from migrations.
spring:
  flyway:
    # The schema under test is the one production runs. ddl-auto would test
    # Hibernate's opinion of the schema instead, which is the drift this whole
    # arc exists to close.
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    hikari:
      # Bounded, so a container that never becomes reachable fails the test in
      # seconds with a clear message instead of hanging the build.
      connection-timeout: 10000
      # Two connections open a context, not Hikari's default of ten. Every test
      # context the lane caches keeps its pool against the ONE container, which
      # takes a hundred clients: at ten a context, a dozen contexts is the lot,
      # and whichever class asked last was refused -- "FATAL: sorry, too many
      # clients already" -- on the order the classes happened to run in (month
      # end 03.5, run 36617779535). A pool still grows to ten under load.
      minimum-idle: 2

logging:
  level:
    root: WARN
    org.flywaydb: INFO

# ACB's jobs -- a run's preparation -- run on the caller's thread under every test lane, so a test
# sees the job's result without waiting for it, and no job outlives the test that started it.
acb:
  jobs:
    synchronous: true
