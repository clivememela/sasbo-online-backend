# gate — the merged gate, on GitHub, on demand.
#
# The GitHub twin of `node tools/test-all.mjs`: the same three lanes, the same commands, the same merge
# tool, the same three exit codes (0 all green · 1 something failed · 2 something did not run).
#
# DISPATCH ONLY. No schedule, no push, no pull_request: every automatic trigger spends minutes nobody
# asked for. WHAT IS TESTED IS THREE COMMITS — the client and server SHAs below, and the commit of the ref
# this workflow was dispatched on, which is the suite's. A branch name is never an input: a branch moves.
#
# It never touches a deployed environment. Every URL the suite sees is a compose service name.
name: gate

on:
  workflow_dispatch:
    inputs:
      client_sha:
        description: 'client commit — 40 hex characters, already pushed to the bench'
        required: true
        type: string
      server_sha:
        description: 'server commit — 40 hex characters, already pushed to the bench'
        required: true
        type: string
      lanes:
        description: 'comma-separated, no spaces: client,server,suite — a partial run is never green (its code is 2)'
        required: false
        default: 'client,server,suite'
        type: string
      label:
        description: 'the arc that is asking, [a-z0-9-] — a newer run with the same label cancels this one'
        required: true
        type: string
      mode:
        description: 'gate — one pass · determinism — the suite lane runs every scenario three times (npm run test:gate)'
        required: false
        default: gate
        type: choice
        options:
          - gate
          - determinism

run-name: 'gate · ${{ inputs.label }} · c:${{ inputs.client_sha }} · s:${{ inputs.server_sha }}'

permissions:
  contents: read

# Stated, not inherited: every script below is bash and says so, whatever a future runner's default becomes.
defaults:
  run:
    shell: bash

concurrency:
  group: gate-${{ inputs.label }}
  # A session that fixes and re-dispatches stops paying for its stale run. Different labels never collide.
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------------------------------
  # preflight — everything that can be refused for free is refused here.
  # ----------------------------------------------------------------------------------------------------
  preflight:
    name: preflight
    # Pinned, like every image and action in this file. `ubuntu-latest` is a moving label, and the day it moves the
    # Docker engine, Compose and the system libraries move with it -- under a suite that pins its browser to the patch.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      client: ${{ steps.shape.outputs.client }}
      server: ${{ steps.shape.outputs.server }}
      suite: ${{ steps.shape.outputs.suite }}
      contract: ${{ steps.contract.outputs.contract }}
    steps:
      # Inputs arrive through `env`, never interpolated into the script: an input is text somebody typed.
      - name: The inputs are what they claim to be
        id: shape
        env:
          CLIENT_SHA: ${{ inputs.client_sha }}
          SERVER_SHA: ${{ inputs.server_sha }}
          LANES: ${{ inputs.lanes }}
          LABEL: ${{ inputs.label }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Called directly, never inside $(...): a message emitted from inside a substitution is swallowed.
          refuse() { echo "::error::$1 Nothing was run."; exit 1; }
          sha='^[0-9a-f]{40}$'
          [[ "$CLIENT_SHA" =~ $sha ]] || refuse "client_sha must be a 40-character lower-case commit SHA. A branch name is never an input, because a branch moves."
          [[ "$SERVER_SHA" =~ $sha ]] || refuse "server_sha must be a 40-character lower-case commit SHA. A branch name is never an input, because a branch moves."
          [[ "$LABEL" =~ ^[a-z0-9-]{1,32}$ ]] || refuse "label must match [a-z0-9-]{1,32}. It names the arc that is asking."
          case "$MODE" in
            gate|determinism) ;;
            *) refuse "mode must be gate or determinism." ;;
          esac
          client=false; server=false; suite=false
          IFS=',' read -r -a asked <<< "$LANES"
          [ "${#asked[@]}" -gt 0 ] || refuse "lanes is empty. Name at least one of client, server, suite."
          for lane in "${asked[@]}"; do
            case "$lane" in
              client) client=true ;;
              server) server=true ;;
              suite) suite=true ;;
              *) refuse "unknown lane '${lane}'. lanes is a comma-separated subset of client,server,suite, with no spaces." ;;
            esac
          done
          # Refused here, for free, rather than after three checkouts and an install in the suite job.
          if [ "$MODE" = determinism ] && [ "$suite" != true ]; then
            refuse "mode=determinism belongs to the suite lane, and the suite lane was not selected."
          fi
          { echo "client=$client"; echo "server=$server"; echo "suite=$suite"; } >> "$GITHUB_OUTPUT"
          echo "lanes: client=$client server=$server suite=$suite · mode=$MODE · label=$LABEL"

      # Only a BOOLEAN about each secret reaches a script. The secrets themselves are named in checkout
      # steps and nowhere else, and no step in this file runs under `set -x`.
      - name: The keys and repository names this run needs exist
        id: keys
        env:
          HAS_CLIENT_KEY: ${{ secrets.BENCH_CLIENT_KEY != '' }}
          HAS_SERVER_KEY: ${{ secrets.BENCH_SERVER_KEY != '' }}
          HAS_CLIENT_REPO: ${{ vars.BENCH_CLIENT_REPO != '' }}
          HAS_SERVER_REPO: ${{ vars.BENCH_SERVER_REPO != '' }}
        run: |
          set -euo pipefail
          # Both commits are read on EVERY run, whichever lanes were asked for: the contract artifacts are compared
          # between the two on every run, exactly as test-all compares them.
          missing=0
          need() {
            if [ "$1" != true ]; then
              echo "::error::$2 is not set on this repository. Nothing was run."
              missing=1
            fi
          }
          need "$HAS_CLIENT_KEY" "The secret BENCH_CLIENT_KEY"
          need "$HAS_CLIENT_REPO" "The variable BENCH_CLIENT_REPO"
          need "$HAS_SERVER_KEY" "The secret BENCH_SERVER_KEY"
          need "$HAS_SERVER_REPO" "The variable BENCH_SERVER_REPO"
          [ "$missing" -eq 0 ]

      # A real checkout, one commit deep: it proves the key reads the bench AND that the commit is there.
      - name: The client commit is on the bench
        id: probe_client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.BENCH_CLIENT_REPO }}
          ref: ${{ inputs.client_sha }}
          ssh-key: ${{ secrets.BENCH_CLIENT_KEY }}
          path: probe/client
          fetch-depth: 1
          persist-credentials: false
      - name: The server commit is on the bench
        id: probe_server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.BENCH_SERVER_REPO }}
          ref: ${{ inputs.server_sha }}
          ssh-key: ${{ secrets.BENCH_SERVER_KEY }}
          path: probe/server
          fetch-depth: 1
          persist-credentials: false

      - name: This workflow, at the commit it was dispatched on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          fetch-depth: 1
          persist-credentials: false
      # Supply-chain rule, asserted rather than remembered. It fails on a movable pin AND on
      # finding no pinned line at all: a guard an empty file can satisfy is not a guard.
      - name: Every `uses:` is pinned to a commit SHA
        id: pins
        working-directory: hub
        run: |
          set -euo pipefail
          if grep -nE 'uses:[[:space:]]*[^@[:space:]]+@(v[0-9][^[:space:]]*|main|master)([[:space:]]|$)' .github/workflows/*.yml; then
            echo "::error::An action above is pinned to a tag or branch. Pin it to a 40-character commit SHA."; exit 1; fi
          grep -qE 'uses:[[:space:]]*[^@[:space:]]+@[0-9a-f]{40}' .github/workflows/*.yml \
            || { echo "::error::No SHA-pinned uses: line found at all — the check is broken, not the file."; exit 1; }

      # The client's copies of the API contract artifacts are compared with the server's originals on EVERY run,
      # by the suite's own tool, exactly as test-all compares them. A drift is a verdict and not a refusal: it is
      # handed to the report, and nothing here stops a lane from running.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: hub/.nvmrc
      - name: The contract artifacts, compared
        id: contract
        run: |
          set +e
          export SASBO_WORKSPACE="$GITHUB_WORKSPACE"
          node hub/tools/test-all.mjs --contract-only --server probe/server --client probe/client --out contract
          code=$?
          state=unknown
          if [ -s contract/result.json ]; then
            state="$(jq -r '.contract // "unknown"' contract/result.json 2>/dev/null)"
          fi
          # Only the two answers the tool is written to give count. Anything else -- a crash, a missing file,
          # a code that contradicts the file -- is no answer, and a run without one cannot be green.
          case "$code:$state" in
            0:clean|1:drift) ;;
            *)
              echo "::warning::The contract comparison gave no answer (exit $code, contract '${state:-}'). The verdict cannot be green."
              state=unknown ;;
          esac
          echo "contract=$state" >> "$GITHUB_OUTPUT"
          echo "contract artifacts: $state"
          # Which file drifted, and which side lacks it, on the run's first screen -- not three clicks into a log. Read
          # from the tool's result.json as data: a rewording of its printed line cannot silently drop a file name.
          if [ "$state" = drift ]; then
            jq -r '.contractArtifacts[]? | select(.state == "drift") | .line' contract/result.json 2>/dev/null \
              | while IFS= read -r line; do echo "::warning::contract artifacts: $line"; done
          fi
          exit 0

      # A checkout that fails speaks git's language ("couldn't find remote ref", "Permission denied (publickey)"), and
      # whoever dispatched this is reading it from a terminal. So the last step says, in one sentence, WHICH refusal it
      # was and what to do about it. It reports; it never decides -- the run is already red.
      - name: What a red preflight means
        if: failure()
        env:
          SHAPE: ${{ steps.shape.outcome }}
          KEYS: ${{ steps.keys.outcome }}
          PROBE_CLIENT: ${{ steps.probe_client.outcome }}
          PROBE_SERVER: ${{ steps.probe_server.outcome }}
          PINS: ${{ steps.pins.outcome }}
        run: |
          said=false
          say() { echo "::error::preflight: $1"; said=true; }
          if [ "$SHAPE" = failure ]; then say "an input was refused. Its own message is above."; fi
          if [ "$KEYS" = failure ]; then say "a secret or a variable this run needs is not set on this repository. It is named above."; fi
          for side in client server; do
            outcome="$PROBE_CLIENT"; if [ "$side" = server ]; then outcome="$PROBE_SERVER"; fi
            if [ "$outcome" = failure ]; then
              say "the $side commit could not be fetched from the bench. EITHER it is not there -- never pushed, or its ref has been force-updated since (then dispatch again; do not re-run) -- OR the key cannot read that repository (the wrong key, or the variable names another repository). git's own words are above."
            fi
          done
          if [ "$PINS" = failure ]; then say "an action in this workflow is not pinned to a commit SHA. The line is above."; fi
          if [ "$said" = false ]; then say "a step failed that this message does not know about. Read the first red step above."; fi
          echo "::notice::No lane started, so nothing was tested and about one minute was spent."

  # ----------------------------------------------------------------------------------------------------
  # client — the contract's commands, verbatim. The same steps as the application's own gate, pointed at a commit.
  # ----------------------------------------------------------------------------------------------------
  client:
    name: client
    needs: preflight
    if: needs.preflight.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8 # about twice the measured 3.6–3.7 min (three runs, 2026-09-21)
    # The exit code travels as a job OUTPUT as well as a file: an artifact that failed to upload -- a full storage
    # pool, a network blip -- must not take the lane's exit code with it and turn a green lane into a guess.
    # The other three commands' codes travel too: the merge names a step that failed outside the tests.
    outputs:
      code: ${{ steps.test.outputs.code }}
      lint: ${{ steps.lint.outputs.code }}
      build: ${{ steps.build.outputs.code }}
      budget: ${{ steps.budget.outputs.code }}
    # The clock is STATED, never inherited. A hosted runner is UTC; this code runs in browsers in South Africa,
    # and every local run of this suite has been in that zone. Neither suite pins one of its own.
    env:
      TZ: Africa/Johannesburg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.BENCH_CLIENT_REPO }}
          ref: ${{ inputs.client_sha }}
          ssh-key: ${{ secrets.BENCH_CLIENT_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        id: lint
        run: |
          set +e
          npm run lint
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # The exit code is half the claim: merge-reports asserts it against the JUnit it reads. A lane that
      # is killed writes neither, and reads as DID NOT RUN.
      - name: Test
        id: test
        run: |
          set +e
          npm test
          code=$?
          mkdir -p reports
          echo "$code" > reports/exit-code
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Build
        id: build
        run: |
          set +e
          npm run build
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Bundle budget
        id: budget
        run: |
          set +e
          npm run budget
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: The lane left a report
        run: |
          set -euo pipefail
          [ -s reports/junit.xml ] || { echo "::error::npm test exited 0 and left no reports/junit.xml — the lane is green for the wrong reason."; exit 1; }
      - name: Upload the client's reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-client
          path: reports/
          retention-days: 7
          # An artifact name is unique per RUN, not per attempt: without this, re-running a job that died before
          # its tests started would fail here, on a name conflict, for a reason that has nothing to do with the code.
          overwrite: true
          if-no-files-found: warn

  # ----------------------------------------------------------------------------------------------------
  # server — `./gradlew verify`: Checkstyle, the fast H2 lane, and the Testcontainers lane.
  # ----------------------------------------------------------------------------------------------------
  server:
    name: server
    needs: preflight
    if: needs.preflight.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8 # about twice the measured 2.9–3.7 min (three runs, 2026-09-21)
    outputs:
      code: ${{ steps.verify.outputs.code }}
    # Stated for the same reason as the client's: a first run must compare like with like. The deployed service
    # runs in UTC, and a UTC pass of this lane is run deliberately, as a probe -- never met by accident.
    env:
      TZ: Africa/Johannesburg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.BENCH_SERVER_REPO }}
          ref: ${{ inputs.server_sha }}
          ssh-key: ${{ secrets.BENCH_SERVER_KEY }}
          persist-credentials: false
      # `cache: gradle` caches the Gradle USER HOME only. Never the BUILD cache: a Test task is cacheable,
      # and a from-cache green ran nothing.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Docker is reachable (Testcontainers needs it)
        run: docker info --format '{{.ServerVersion}}'
      - name: Verify
        id: verify
        run: |
          set +e
          ./gradlew verify --no-daemon
          code=$?
          mkdir -p reports
          echo "$code" > reports/exit-code
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # Non-vacuity: floors sit well BELOW the real counts and are never raised to match them. 0 warns.
      # Set from the first three runs (2026-09-21), each of which ran 429 fast and 116 integration test cases.
      - name: Both lanes actually ran tests
        env:
          FAST_FLOOR: 350
          INTEGRATION_FLOOR: 90
        run: |
          set -euo pipefail
          count() { (grep -rho '<testcase ' "$1" --include='*.xml' 2>/dev/null || true) | wc -l; }
          fast=$(count reports/junit/test)
          integration=$(count reports/junit/integrationTest)
          echo "testcases: fast $fast (floor $FAST_FLOOR) · integration $integration (floor $INTEGRATION_FLOOR)"
          if [ "$FAST_FLOOR" -eq 0 ] || [ "$INTEGRATION_FLOOR" -eq 0 ]; then
            echo "::warning::A test-count floor is not set yet; set both from this run's counts, with headroom."
          fi
          if [ "$fast" -lt "$FAST_FLOOR" ]; then
            echo "::error::Only $fast test cases ran in the fast lane; the floor is $FAST_FLOOR."; exit 1; fi
          if [ "$integration" -lt "$INTEGRATION_FLOOR" ]; then
            echo "::error::Only $integration integration test cases ran; the floor is $INTEGRATION_FLOOR."; exit 1; fi
      - name: Upload the server's reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-server
          path: reports/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  # ----------------------------------------------------------------------------------------------------
  # suite — this job does not re-implement the suite lane. It RUNS it.
  # ----------------------------------------------------------------------------------------------------
  suite:
    name: suite
    needs: preflight
    if: needs.preflight.outputs.suite == 'true'
    runs-on: ubuntu-24.04
    # About twice the measured: 13.0 min for a gate pass once month end's journeys came (run 36997556756, 2026-10-02),
    # where 7.6–7.8 min was measured before them (three runs, 2026-09-21); a determinism pass runs every test three
    # times, and each scenario of the serial project restarts the API.
    timeout-minutes: ${{ inputs.mode == 'determinism' && 60 || 26 }}
    outputs:
      code: ${{ steps.lane.outputs.code }}
      tool_code: ${{ steps.lane.outputs.tool_code }}
      contract: ${{ steps.lane.outputs.contract }}
    steps:
      # Three checkouts side by side, under the names the suite's tools look for.
      - name: The suite, at the commit this workflow was dispatched on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/sasbo-automation-testing
          persist-credentials: false
      - name: The client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.BENCH_CLIENT_REPO }}
          ref: ${{ inputs.client_sha }}
          ssh-key: ${{ secrets.BENCH_CLIENT_KEY }}
          path: ws/client
          persist-credentials: false
      - name: The server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.BENCH_SERVER_REPO }}
          ref: ${{ inputs.server_sha }}
          ssh-key: ${{ secrets.BENCH_SERVER_KEY }}
          path: ws/server
          persist-credentials: false
      # The client's pin (24.14.0) satisfies the suite's `>=24 <25`, and test-all needs Node 24.2+.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ws/client/.nvmrc
          cache: npm
          cache-dependency-path: ws/client/package-lock.json
      - name: Docker and Compose are reachable, and the disk has room
        run: |
          set -euo pipefail
          docker info --format 'docker {{.ServerVersion}}'
          docker compose version
          df -h "$GITHUB_WORKSPACE"
      # test-all refuses to install for you: "a minutes-long install nobody asked for inside a test run is
      # its own surprise".
      - name: Install the client's dependencies (its production bundle is built from them)
        working-directory: ws/client
        run: npm ci
      # Compose validation, BOTH image recipes (the tags read from the resolved config; the client built
      # with VITE_API_BASE_URL EMPTY), the service list, bring-up, the suite container, teardown and the
      # contract-artifact comparison all live in this one tool. Nothing here spells any of it out again.
      - name: The suite lane — images, stack, journeys, teardown, contract artifacts
        id: lane
        working-directory: ws/sasbo-automation-testing
        env:
          STACK_ID: gh-${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set +e
          export SASBO_WORKSPACE="$GITHUB_WORKSPACE/ws"
          # determinism: the tool runs the suite as `npm run test:gate` -- every test three times -- and nothing else changes.
          determinism=()
          if [ "$MODE" = determinism ]; then determinism=(--determinism); fi
          node tools/test-all.mjs --only suite --stack-id "$STACK_ID" "${determinism[@]}"
          tool=$?
          echo "tool_code=$tool" >> "$GITHUB_OUTPUT"
          # The suite container runs as root, and on a Linux bind mount what it wrote is root's. test-all hands it back
          # (giveOutputBack, suite ad54699), but that is never fatal, so a failure there would leave every write below --
          # the exit code, the image lists -- failing quietly. A backup that costs nothing.
          sudo chown -R "$(id -u):$(id -g)" reports test-results 2>/dev/null || true
          # The tool exits 2 whenever it ran one lane of three -- a partial run is never green -- so its code cannot
          # say whether THIS lane passed. Its result.json can: what the suite process itself returned, the lane's
          # status and the contract comparison, as data rather than prose.
          result="$SASBO_WORKSPACE/reports/merged/result.json"
          code=''; status=''; contract=''
          if [ -s "$result" ]; then
            mkdir -p reports
            cp "$result" reports/test-all-result.json
            code="$(jq -r '.sections[] | select(.key == "suite") | .processExit // empty' "$result")"
            status="$(jq -r '.sections[] | select(.key == "suite") | .status // empty' "$result")"
            contract="$(jq -r '.contract // empty' "$result")"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "suite lane: the tool exited $tool · the suite exited ${code:-(unknown)} · status ${status:-(unknown)} · contract ${contract:-(unknown)}"
          df -h "$GITHUB_WORKSPACE"
          if ! [[ "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::The suite's tool (exit $tool) left no result.json saying what the suite returned. This lane has no verdict."
            exit 1
          fi
          # Beside its reports, like every lane's: the report reads one file the same way for all three.
          mkdir -p reports
          echo "$code" > reports/exit-code
          # The job's conclusion is the suite's own: red when the suite -- or the stack under it -- did not exit 0.
          # A drift in the contract is the report's to name, and a missing report the merge tool's.
          exit "$code"
      # Three commits are not the whole identity of a run: the database, the mail catcher and the browser arrive BY TAG,
      # and a tag can move between two runs of the same three commits. images-stack.txt is the stack's own images by
      # registry digest -- the two this run built say only that, being named by the commits -- and its fingerprint
      # travels in the verdict. What it cannot say: the build bases arrive by tag too, and BuildKit lists none of them
      # (the build log names them). images.txt is everything on the runner, which ships images of its own.
      - name: Which images this run used — by digest
        if: always()
        working-directory: ws/sasbo-automation-testing
        run: |
          # A diagnostic must never turn a green lane red: whatever goes wrong here is said, and swallowed.
          mkdir -p reports 2>/dev/null || true
          { docker image ls --digests --format '{{.Repository}}:{{.Tag}}  {{.Digest}}  {{.ID}}' || echo 'docker image ls failed'; } \
            | sort | tee reports/images.txt || true
          { docker compose config --images || echo 'docker compose config failed'; } | sort -u | while IFS= read -r image; do
            echo "$image  $(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}built on this runner{{end}}' \
              "$image" 2>/dev/null || echo 'not on this runner')"
          done | tee reports/images-stack.txt || true
      - name: Upload the suite's reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-suite
          path: ws/sasbo-automation-testing/reports/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
      # Traces, videos and screenshots show whatever was on screen, and that is member data. Red runs
      # only; seven days; never the images. The stack's own logs -- kept by the tool on a red lane, before the
      # teardown took the containers -- sit beside the merged report, where a Linux runner's user can write.
      - name: Upload the failure evidence (red only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-suite
          path: |
            ws/sasbo-automation-testing/test-results/
            ws/reports/stack/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------------------------------
  # report — ONE verdict. It runs whatever happened to the lanes.
  # ----------------------------------------------------------------------------------------------------
  report:
    name: report
    needs: [preflight, client, server, suite]
    # A red preflight already failed the run, and there is nothing to merge. `!cancelled()`, not `always()`: a run
    # superseded by a newer one with the same label must not spend minutes on a report nobody will read. A lane
    # that TIMED OUT cancels only its own job -- the run is not cancelled -- so this still runs, and says so.
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the report takes seconds (0.1–0.3 min measured)
    steps:
      - name: The merge tool, at the commit this workflow was dispatched on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/sasbo-automation-testing
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ws/sasbo-automation-testing/.nvmrc
      # One download per lane, each into a directory of its own. A pattern that matches nothing downloads nothing
      # and does not fail -- a lane killed before it uploaded is the merge tool's to call DID NOT RUN. And one that
      # matches exactly ONE artifact unpacks it straight into `path`, not into a folder named after it; a single
      # shared path would have made a one-lane run's reports land where no lane's are looked for.
      # Each runs whatever the one before it did: GitHub's artifact service can refuse a listing outright (a 403 "from
      # intermediary" has been seen here), and one lane's failed fetch must not cost the other lanes theirs.
      - name: Fetch the client's reports, if it left any
        id: dl_client
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reports-client
          path: dl/client/reports
      - name: Fetch the server's reports, if it left any
        id: dl_server
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reports-server
          path: dl/server/reports
      - name: Fetch the suite's reports, if it left any
        id: dl_suite
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reports-suite
          path: dl/suite/reports
      # Whatever the fetches did: a verdict must never go down with a download. A lane whose reports did not arrive
      # is said by name below, and cannot be green.
      - name: Merge, and publish the verdict
        if: ${{ !cancelled() }}
        env:
          DL_CLIENT: ${{ steps.dl_client.outcome }}
          DL_SERVER: ${{ steps.dl_server.outcome }}
          DL_SUITE: ${{ steps.dl_suite.outcome }}
          SEL_CLIENT: ${{ needs.preflight.outputs.client }}
          SEL_SERVER: ${{ needs.preflight.outputs.server }}
          SEL_SUITE: ${{ needs.preflight.outputs.suite }}
          CONTRACT_PREFLIGHT: ${{ needs.preflight.outputs.contract }}
          RES_CLIENT: ${{ needs.client.result }}
          RES_SERVER: ${{ needs.server.result }}
          RES_SUITE: ${{ needs.suite.result }}
          CODE_CLIENT: ${{ needs.client.outputs.code }}
          CODE_SERVER: ${{ needs.server.outputs.code }}
          CODE_SUITE: ${{ needs.suite.outputs.code }}
          STEP_CLIENT_LINT: ${{ needs.client.outputs.lint }}
          STEP_CLIENT_BUILD: ${{ needs.client.outputs.build }}
          STEP_CLIENT_BUDGET: ${{ needs.client.outputs.budget }}
          TOOL_SUITE: ${{ needs.suite.outputs.tool_code }}
          CONTRACT_LANE: ${{ needs.suite.outputs.contract }}
          CLIENT_SHA: ${{ inputs.client_sha }}
          SERVER_SHA: ${{ inputs.server_sha }}
          SUITE_SHA: ${{ github.sha }}
          LANES: ${{ inputs.lanes }}
          LABEL: ${{ inputs.label }}
          MODE: ${{ inputs.mode }}
        run: |
          # `shell: bash` runs every script as `bash -eo pipefail`, so errexit is ON unless it is switched off. Off here,
          # on purpose: the merge tool exits 1 or 2 whenever the news is bad, and that is exactly when this step must go
          # on to write the verdict rather than die on the line that learned it.
          set +e
          set -uo pipefail
          ws="$GITHUB_WORKSPACE/ws"
          export SASBO_WORKSPACE="$ws"
          # Each lane's reports are in <dl>/<lane>/reports, where its download put them -- the layout the merge tool
          # reads under a checkout -- so the tool is pointed there and nothing is copied.
          dl="$GITHUB_WORKSPACE/dl"
          merged="$ws/reports/merged"
          declare -A selected=( [client]="$SEL_CLIENT" [server]="$SEL_SERVER" [suite]="$SEL_SUITE" )
          declare -A result=( [client]="$RES_CLIENT" [server]="$RES_SERVER" [suite]="$RES_SUITE" )
          # Each lane's exit code as a job OUTPUT: it survives an artifact that never arrived. The suite's is the
          # suite process's own, read from its tool's result.json -- never the tool's code, which folds more in.
          declare -A returned=( [client]="$CODE_CLIENT" [server]="$CODE_SERVER" [suite]="$CODE_SUITE" )
          # Whether each lane's reports were fetched at all. Anything but `success` means the files below are missing
          # or partial, whatever they show -- so the lane is never read as green.
          declare -A fetched=( [client]="$DL_CLIENT" [server]="$DL_SERVER" [suite]="$DL_SUITE" )
          # What each lane ran outside its tests that failed, for the sentence below. Only the client runs any.
          declare -A outside=( [client]='' [server]='' [suite]='' )
          unfetched=''

          # The contract comparison: preflight's, made on every run; the suite lane's own if preflight had none.
          contract="$CONTRACT_PREFLIGHT"
          case "$contract" in clean|drift) ;; *) contract="$CONTRACT_LANE" ;; esac
          case "$contract" in clean|drift) ;; *) contract=unknown ;; esac

          args=(--out "$merged")
          partial=false
          for lane in client server suite; do
            if [ "${selected[$lane]}" != true ]; then partial=true; continue; fi
            args+=(--only "$lane" "--$lane" "$dl/$lane")
            if [ "${fetched[$lane]}" != success ]; then unfetched="$unfetched $lane(${fetched[$lane]:-not run})"; fi
            # The job output first, the file second: the output survives an artifact that never arrived.
            lane_code="${returned[$lane]}"
            f="$dl/$lane/reports/exit-code"
            if [ -z "$lane_code" ] && [ -s "$f" ]; then lane_code="$(tr -dc '0-9' < "$f")"; fi
            # Only a number is handed over. Anything else is no code at all, and the merge then makes no claim about one.
            if [[ "$lane_code" =~ ^[0-9]+$ ]]; then args+=(--exit "$lane:$lane_code"); fi
          done
          # The client's lint, build and budget, in the order they ran. One that never ran has no code and is not handed
          # over; one that failed fails the lane however green its tests are, and is named.
          if [ "${selected[client]}" = true ]; then
            for s in "lint:$STEP_CLIENT_LINT" "build:$STEP_CLIENT_BUILD" "budget:$STEP_CLIENT_BUDGET"; do
              [[ "${s#*:}" =~ ^[0-9]+$ ]] || continue
              args+=(--step "client:$s")
              if [ "${s#*:}" -ne 0 ]; then outside[client]="${outside[client]:+${outside[client]}, }${s%%:*} exited ${s#*:}"; fi
            done
          fi
          if [ "$contract" != unknown ]; then args+=(--contract "$contract"); fi

          # Its output is the per-lane count line a reader wants first, so it is kept for the summary as well as shown.
          node "$ws/sasbo-automation-testing/tools/merge-reports.mjs" "${args[@]}" | tee "$RUNNER_TEMP/merge.txt"
          merge=${PIPESTATUS[0]}
          # The merge tool speaks three codes. Anything else means the TOOL failed -- a crash, a missing file, no Node --
          # and that is "no verdict", never a number somebody could take for a test result.
          tool_failed=false
          case "$merge" in
            0|1|2) ;;
            *) echo "::error::The merge tool itself failed (exit $merge). There is no verdict about the code."; tool_failed=true; merge=2 ;;
          esac
          # What it wrote as data. A result.json that is missing, or says nothing about the lanes asked for, is the tool
          # failing too -- never a pass.
          in_scope=null
          if [ "$tool_failed" = false ]; then
            if ! in_scope="$(jq -e -r '.inScopePassed | if type == "boolean" then tostring else error("no answer") end' "$merged/result.json" 2>/dev/null)"; then
              echo "::error::The merge tool exited $merge and left no readable result.json. There is no verdict about the code."
              tool_failed=true; merge=2; in_scope=null
            fi
          fi

          # The merge tool's code is the verdict, corrected for what it was not told and only for that:
          #   a selected job that FAILED -- a report never written, an upload, the server's test floors, a stack that
          #   never came up -- makes it 1, and so does a drift between the contract artifacts;
          #   a selected job that was cancelled or timed out, or a contract nobody compared, makes a 0 a 2.
          code=$merge
          failed=''; absent=''
          for lane in client server suite; do
            [ "${selected[$lane]}" = true ] || continue
            case "${result[$lane]}" in
              success) ;;
              failure)
                if [ "$lane" = suite ] && [ -n "${returned[suite]}" ]; then
                  failed="$failed suite(the suite exited ${returned[suite]}; its job's log says whether the stack came up)"
                elif [ "$lane" = suite ]; then
                  failed="$failed suite(its tool exited ${TOOL_SUITE:-?} and left no word on the suite; see its job's log)"
                elif [ -n "${returned[$lane]}" ]; then
                  # Its tests may well have passed: lint, the build, the budget or an upload fail a lane too.
                  failed="$failed $lane(its tests exited ${returned[$lane]}; ${outside[$lane]:-the JOB failed — see its first red step})"
                elif [ -n "${outside[$lane]}" ]; then
                  failed="$failed $lane(${outside[$lane]})"
                else
                  failed="$failed $lane"
                fi ;;
              # This job does not run when the RUN is cancelled, so a lane that reads `cancelled` here was stopped on
              # its own -- which is what a timeout looks like: GitHub reports a timed-out job as cancelled.
              cancelled) absent="$absent $lane(timed out)" ;;
              *) absent="$absent $lane(${result[$lane]})" ;;
            esac
          done
          if [ "$contract" = drift ]; then
            failed="$failed contract(the client's copy of an API contract artifact differs from the server's original)"
          fi
          if [ -n "$failed" ]; then code=1; fi
          if { [ -n "$absent" ] || [ "$contract" = unknown ]; } && [ "$code" -eq 0 ]; then code=2; fi
          # Reports that were not fetched -- or fetched in part -- are no evidence of a pass, whatever the files show.
          if [ -n "$unfetched" ] && [ "$code" -eq 0 ]; then code=2; fi

          case "$code" in
            0) headline="PASSED — every lane ran, every test in every lane passed, and the contract artifacts agree" ;;
            1) headline="FAILED —${failed:- a test failed; the merged report names it}" ;;
            *) headline="INCOMPLETE — something did not run" ;;
          esac
          # Said whatever the code is: a lane that timed out must not vanish from the sentence because another lane failed.
          if [ -n "$absent" ]; then headline="$headline · did not finish:$absent"; fi
          if [ "$contract" = unknown ]; then headline="$headline · the contract artifacts were not compared"; fi
          if [ -n "$unfetched" ]; then
            # The report job on its own: re-running the failed jobs would re-run a red lane along with it.
            headline="$headline · reports not fetched:$unfetched -- GitHub's artifact service; re-running the report job on its own fetches them again"
          fi
          if [ "$tool_failed" = true ]; then
            # Appended, never substituted: a lane that failed is still a failure, and the code above still says so.
            headline="$headline · AND the merge tool itself failed, so there are no counts and this is not a full verdict"
          fi

          # A partial run is never green: its code is 2, exactly as test-all --only's is. But when every lane that WAS
          # asked for ran and passed, and the contract agrees, this job ends green -- a session that tested one lane is
          # told so, and nobody is mailed a failure for a run that did everything it was asked to.
          job_exit=$code
          lanes_passed=false
          if [ "$partial" = true ]; then
            if [ "$code" -eq 2 ] && [ "$in_scope" = true ] && [ -z "$failed" ] && [ -z "$absent" ] && [ -z "$unfetched" ] \
              && [ "$contract" = clean ] && [ "$tool_failed" = false ]; then
              lanes_passed=true
              job_exit=0
              headline="PARTIAL RUN PASSED — every lane asked for ($LANES) ran and passed, and the contract artifacts agree · the code is 2, because a partial run is never the whole gate"
            else
              headline="$headline · PARTIAL RUN (lanes: $LANES) — a partial run is never green, exactly as test-all --only is not"
            fi
          fi

          # The failing tests by NAME, from the merge tool's own result -- the first few, each red lane represented before
          # any lane gets a second row. An empty list never means green: a lane can be red with no failing case.
          failing=''; more=0
          if [ "$tool_failed" = false ]; then
            failing="$(jq -r '(.failures // [])[] | "- **\(.label)** — \(.name)" + (if (.message // "") != "" then " — \(.message)" else "" end)' \
              "$merged/result.json" 2>/dev/null)"
            more="$(jq -r '((.failuresTotal // 0) - ((.failures // []) | length))' "$merged/result.json" 2>/dev/null)"
          fi
          [[ "$more" =~ ^[0-9]+$ ]] || more=0

          # A fingerprint of the stack's images by registry digest, as the suite lane recorded them. Two runs of the same
          # three commits that disagree are only a flake if they also ran the same images, and this lets that be asked of
          # the small verdict file alone.
          images=''
          if [ -s "$dl/suite/reports/images-stack.txt" ]; then
            images="$(sha256sum "$dl/suite/reports/images-stack.txt" | cut -c1-16)"
          fi
          mkdir -p "$merged"
          # The file the tool reads its exit code from. Failing to write it is said, and never passed off as a verdict.
          if ! jq -n \
            --argjson code "$code" --argjson merge "$merge" --argjson job_exit "$job_exit" --arg headline "$headline" \
            --arg lanes "$LANES" --arg label "$LABEL" --arg mode "$MODE" \
            --argjson partial "$partial" --argjson lanes_passed "$lanes_passed" --argjson in_scope_passed "$in_scope" \
            --arg contract "$contract" \
            --arg client "$CLIENT_SHA" --arg server "$SERVER_SHA" --arg suite "$SUITE_SHA" \
            --arg rc "$RES_CLIENT" --arg rs "$RES_SERVER" --arg ru "$RES_SUITE" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg images "$images" --arg tool "$TOOL_SUITE" --arg unfetched "${unfetched# }" \
            '{schema: 1, code: $code, merge: $merge, job_exit: $job_exit, headline: $headline,
              lanes: $lanes, label: $label, mode: $mode, partial: $partial, lanes_passed: $lanes_passed,
              in_scope_passed: $in_scope_passed, contract: $contract, unfetched: $unfetched,
              commits: {client: $client, server: $server, suite: $suite},
              jobs: {client: $rc, server: $rs, suite: $ru}, suite_tool_code: $tool, images: $images,
              run: $run, attempt: $attempt}' \
            > "$merged/gate-verdict.json"; then
            echo "::error::gate-verdict.json could not be written, so the tool has no verdict to read."
            rm -f "$merged/gate-verdict.json"
            if [ "$job_exit" -eq 0 ]; then job_exit=2; fi
          fi

          {
            echo "## $headline"
            echo
            echo "| | commit | job |"
            echo "| :-- | :-- | :-- |"
            echo "| client | \`$CLIENT_SHA\` | $RES_CLIENT |"
            echo "| server | \`$SERVER_SHA\` | $RES_SERVER |"
            echo "| suite | \`$SUITE_SHA\` | $RES_SUITE |"
            echo
            echo "Verdict **$code** (the merge tool said $merge) · contract artifacts **$contract** · label \`$LABEL\` · mode \`$MODE\` · attempt $GITHUB_RUN_ATTEMPT"
            echo
            if [ -n "$failing" ]; then
              echo "Failing tests:"
              echo
              echo "$failing"
              if [ "$more" -gt 0 ]; then echo "- …and $more more — the merged report lists every one"; fi
              echo
            fi
            echo "What the merge tool said, lane by lane:"
            echo
            echo '~~~text'
            cat "$RUNNER_TEMP/merge.txt" 2>/dev/null || echo '(the merge tool printed nothing)'
            echo '~~~'
            echo
            echo "A re-run of a red **test** is not evidence. *Re-run failed jobs* is for a job that died before its tests started."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$headline"
          exit "$job_exit"
      - name: Upload the merged report and the verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merged-report
          path: ws/reports/merged/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
